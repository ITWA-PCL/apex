server {
    listen 80;
    server_name localhost;

    access_log /var/log/nginx/access.log;

    location / {
        proxy_pass http://dept-app:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # ------------------------------------------------------------------
        # IT Mock Headers: จำลองพนักงานที่ล็อกอินเข้ามา
        # เมื่อขึ้น Production ระบบ SSO กลางจะส่งค่าจริงเข้ามาแทน
        # ------------------------------------------------------------------
        proxy_set_header X-User-ID "EMP-1001";
        proxy_set_header X-User-Email "staff@company.com";
        proxy_set_header X-User-Role "Department_User";
        proxy_set_header X-User-Department "Operations";

        client_max_body_size 25M;
    }
}
