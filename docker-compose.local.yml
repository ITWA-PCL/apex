version: '3.8'

# ============================================================================
# APEX — Local Development Compose (with Mock Auth Proxy on Port 8080)
# Usage on Local Machine: docker compose -f docker-compose.local.yml up --build
# ============================================================================
services:
  mock-auth-proxy:
    image: nginx:alpine
    container_name: apex-mock-auth-proxy
    ports:
      - "8080:80"
    volumes:
      - ./auth-proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - dept-app
    networks:
      - apex-local-net

  dept-app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: apex-local-app
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: "postgresql://dept_user:dept_password_local@dept-db:5432/dept_db"
    expose:
      - "3000"
    depends_on:
      - dept-db
    networks:
      - apex-local-net

  dept-db:
    image: postgres:16-alpine
    container_name: apex-local-db
    environment:
      POSTGRES_USER: dept_user
      POSTGRES_PASSWORD: dept_password_local
      POSTGRES_DB: dept_db
    volumes:
      - apex_local_db_data:/var/lib/postgresql/data
    networks:
      - apex-local-net

networks:
  apex-local-net:
    driver: bridge

volumes:
  apex_local_db_data:
