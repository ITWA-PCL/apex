version: '3.8'

# ============================================================================
# APEX (apex.windowasia.com) — Production Docker Compose for Hostinger VPS
# Server Path: /var/www/Apex
# Isolated from the other 5 Production Apps on Hostinger VPS:
#   - Unique container names: apex-postgres, apex-app
#   - Unique internal network: apex-network (+ external Traefik root_default)
#   - Unique named volumes: apex_postgres_data, apex_uploads
#   - Zero host port collisions (routed via Traefik on root_default -> port 3000)
# ============================================================================

services:
  postgres:
    image: postgres:16
    container_name: apex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: apex
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-apex_password}"
      POSTGRES_DB: apex
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    volumes:
      - apex_postgres_data:/var/lib/postgresql/data
    networks:
      - apex-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apex -d apex"]
      interval: 10s
      timeout: 5s
      retries: 5

  apex-app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: apex-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: "postgresql://apex:${POSTGRES_PASSWORD:-apex_password}@postgres:5432/apex"
      APP_MASTER_KEY: "${APP_MASTER_KEY:-apex_windowasia_iso27001_master_key_2026}"
      APEX_INITIAL_ADMIN_PASSWORD: "${APEX_INITIAL_ADMIN_PASSWORD:-}"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - apex_uploads:/usr/src/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - apex-network
      - root_default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=root_default"
      - "traefik.http.routers.apex.entrypoints=websecure"
      - "traefik.http.routers.apex.rule=Host(`apex.windowasia.com`)"
      - "traefik.http.routers.apex.tls=true"
      - "traefik.http.routers.apex.tls.certresolver=mytlschallenge"
      - "traefik.http.services.apex.loadbalancer.server.port=3000"

networks:
  apex-network:
    name: apex-network
    driver: bridge
  root_default:
    external: true

volumes:
  apex_postgres_data:
    name: apex_postgres_data
  apex_uploads:
    name: apex_uploads
