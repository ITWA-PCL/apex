name: Deploy APEX to Hostinger VPS (/var/www/Apex)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify-and-deploy:
    name: Verify Code & Deploy to Hostinger VPS
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_PORT: ${{ secrets.VPS_PORT }}

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Install Dependencies & Run Pre-Deploy Verification Suite
        run: |
          npm --prefix app ci
          node scripts/verify-local.js

      - name: 4. Resolve SSH Port (Default 22) & Lock Verified Commit SHA
        id: prep
        if: env.VPS_HOST != '' && env.VPS_USER != '' && env.VPS_SSH_KEY != ''
        run: |
          RESOLVED_PORT="${VPS_PORT:-22}"
          echo "port=${RESOLVED_PORT}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: 5. Auto-Deploy Verified Commit to Hostinger VPS (/var/www/Apex) via SSH
        if: env.VPS_HOST != '' && env.VPS_USER != '' && env.VPS_SSH_KEY != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ steps.prep.outputs.port }}
          script_stop: true
          script: |
            set -euo pipefail
            if [ ! -d "/var/www/Apex/.git" ]; then
              mkdir -p /var/www
              git clone https://github.com/ITWA-PCL/apex.git /var/www/Apex
            fi
            cd /var/www/Apex
            git fetch origin main
            git checkout --detach "${{ steps.prep.outputs.sha }}"
            APEX_DEPLOY_COMMIT="${{ steps.prep.outputs.sha }}" bash scripts/deploy-vps.sh

      - name: 6. Notice when SSH Secrets are not configured yet
        if: env.VPS_HOST == ''
        run: |
          echo "ℹ️ GitHub Secret VPS_HOST is not configured yet."
          echo "You can either add VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_PORT in GitHub Repo Settings -> Secrets,"
          echo "or SSH into Hostinger VPS manually and run: cd /var/www/Apex && bash scripts/deploy-vps.sh"
